<style>
/* Two parts. «Установи»: the offices of Xanten and of Wesel (the district), each a card — what it is for, open now or
   not, the hours as a short table, how to get an appointment, address and phone, and the office's own page.
   «Події»: what is on in Xanten from the city's calendar, by day; running exhibitions and weekly tours after. */
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{border:0;background:transparent;border-radius:10px;min-height:44px;padding:6px 2px;font-weight:600;font-size:15px;cursor:pointer;color:var(--ink)}
.view{display:grid;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.place{display:grid;gap:8px}
.place .hd{display:flex;gap:10px;align-items:flex-start}
.place .ic{font-size:26px;line-height:1.1;flex:none}
.place h2{margin:0;font-size:18px;line-height:1.25}
.place .de{display:block;color:var(--muted);font-size:14px;font-weight:500;margin-top:2px}
.place p{margin:0}
.state{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;margin:0}
.state::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--muted)}
.state.open{color:var(--on)}.state.open::before{background:var(--on)}
.state.shut{color:var(--muted)}
.hours{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;margin:0;font-size:15px}
.hours dt{font-weight:600}
.hours dd{margin:0}
.hours small{color:var(--muted)}
.hours .today{color:var(--accent)}
.book{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px}
.tips{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14.5px;color:var(--muted)}
.contact{display:grid;gap:6px;font-size:15px}
.contact a{color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.act{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600;font-size:15px;text-decoration:none}
.act.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.checked{font-size:13px;color:var(--muted);margin:0}
.day h2{font-size:16px;margin:4px 2px 0;color:var(--muted);font-weight:600;text-transform:none}
.ev{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.ev:first-of-type{border-top:0}
.ev .tm{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;color:var(--accent)}
.ev b{display:block;font-weight:600;font-size:16px;line-height:1.3}
.ev small{display:block;color:var(--muted);font-size:14px;line-height:1.35;margin-top:2px}
.msg{margin:0;color:var(--muted)}
.msg.err{color:var(--danger);font-weight:600}
.skel{height:64px;border-radius:12px;background:var(--line);opacity:.4;animation:pg-pulse 1s ease-in-out infinite alternate}
.foot{font-size:13px;color:var(--muted)}
</style>
<link rel="stylesheet" href="../assets/ui.css?v=9b6f3eca">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="toprow"><button class="menubtn" id="menubtn" type="button" aria-expanded="false" aria-controls="drawer" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Розділи</span></button><button class="themebtn" id="themebtn" type="button" aria-label="Увімкнути темну тему"><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M5.3 18.7L7 17M17 7l1.7-1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6z" fill="currentColor"/></svg></button></div>
    <div class="eyebrow">Ксантен і Везель</div>
    <h1>Місто</h1>
    <p class="lede">Установи: де, коли працюють і як записатися. І що відбувається в Ксантені.</p>
  </header>

  <main>
    <div class="tabs" role="tablist" aria-label="Частини розділу" id="tabs">
      <span class="tthumb" aria-hidden="true"></span>
      <button role="tab" type="button" id="tab-places" data-tab="places" aria-controls="view-places" aria-selected="true">Установи</button>
      <button role="tab" type="button" id="tab-events" data-tab="events" aria-controls="view-events" aria-selected="false">Події</button>
    </div>
    <section class="view" id="view-places" role="tabpanel" aria-labelledby="tab-places"></section>
    <section class="view" id="view-events" role="tabpanel" aria-labelledby="tab-events" hidden></section>
  </main>
  <p class="foot" id="foot"></p>
</div>

</body>
</html>
