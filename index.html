<style>
/* The home screen: what matters today at a glance. Every card leads to its section: weather, the next waste pickup,
   departures from your stop, this week's flyers; then quick actions and, last, the appliance instructions. */
:root{
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  --bg:#E7ECEF; --surface:#F6F8F9; --ink:#12181C; --muted:#53616A; --line:#C7D0D5; --accent:#9A5800;
  --accent-soft:#F7E3BF; --on:#2E7D32; --danger:#B3261E;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest","Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0F1417; --surface:#182026; --ink:#E5EBEE; --muted:#98A6AE; --line:#2A343B; --accent:#FFB424;
    --accent-soft:#3A2909; --on:#66BB6A; --danger:#FF8A80; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0F1417; --surface:#182026; --ink:#E5EBEE; --muted:#98A6AE; --line:#2A343B; --accent:#FFB424;
  --accent-soft:#3A2909; --on:#66BB6A; --danger:#FF8A80; color-scheme:dark; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
.top{padding-block:16px 6px}
.eyebrow{font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.08;margin:6px 0 8px;letter-spacing:-.01em}
.lede{margin:0;color:var(--muted);font-size:16px;max-width:42ch}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding-top:14px}

/* a card is one big link to its section */
.card{display:block;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px 16px;
  color:inherit;text-decoration:none;min-width:0;animation:in .5s var(--ease-out, cubic-bezier(.22,1,.36,1)) backwards;animation-delay:calc(var(--i, 0) * 45ms);
  transition:transform .18s var(--ease-out, ease), border-color .2s ease, background-color .2s ease}
.card:active{transform:scale(.985)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ch{display:flex;align-items:center;gap:10px;min-height:28px}
.ch .ic{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line)}
.ch .ic svg{width:18px;height:18px}
.ch .lab{flex:1;min-width:0;font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .go{flex:none;width:18px;height:18px;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.2;margin-top:10px;overflow-wrap:anywhere}
.sub{margin:4px 0 0;color:var(--muted);font-size:15px;line-height:1.4}
.skel{display:block;height:14px;border-radius:7px;background:var(--line);opacity:.55;margin-top:12px;animation:pulse 1.4s ease-in-out infinite alternate}
.skel.w60{width:60%}.skel.w40{width:40%;height:22px}
@keyframes pulse{to{opacity:.25}}

/* weather */
.wx{display:flex;align-items:center;gap:14px;margin-top:8px}
.wx .wxi{width:52px;height:52px;flex:none}
.wx .t{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1;letter-spacing:-.02em}
.wx .d{font-weight:600;font-size:16px;margin-top:4px}
.tip{margin:12px 0 0;display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.4;background:var(--accent-soft);border-radius:12px;padding:9px 11px}
.tip.dry{background:var(--bg)}
.tip svg{flex:none;width:18px;height:18px;margin-top:1px;color:var(--accent)}
.tip.dry svg{color:var(--on)}
.wxi .sun,.wxi .moon,.wxi .bolt{stroke:var(--accent)}
/* an official DWD warning on the weather card */
:root{--w1:#C9A100;--w2:#D9700F;--w3:#C62828;--w4:#7B1FA2}
:root[data-theme="dark"]{--w1:#F2D24B;--w2:#FFA24D;--w3:#FF6B60;--w4:#CE93D8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--w1:#F2D24B;--w2:#FFA24D;--w3:#FF6B60;--w4:#CE93D8}}
.dwd{margin:12px 0 0;display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4;border-radius:12px;padding:9px 11px;background:var(--bg);border-left:5px solid var(--wc)}
.dwd.lv1{--wc:var(--w1)}.dwd.lv2{--wc:var(--w2)}.dwd.lv3{--wc:var(--w3)}.dwd.lv4{--wc:var(--w4)}
.dwd b{font-weight:700}
.dwd small{display:block;color:var(--muted);font-size:13.5px}

/* waste */
.card.soon{background:var(--accent-soft);border-color:transparent}
.card.soon .ch .ic{background:var(--surface);border-color:transparent}
.bins{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.bins li{display:inline-flex;align-items:center;gap:8px;padding:5px 11px 5px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:15px}
.card.soon .bins li{border-color:transparent}
.bins .dot{width:18px;height:18px;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.45)}

/* departures */
.deps{list-style:none;margin:10px 0 0;padding:0;display:grid}
.deps li{display:grid;grid-template-columns:52px auto minmax(0,1fr);align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.deps li:first-child{border-top:0}
.deps .m{font-family:var(--f-display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.deps .m.now{color:var(--accent)}
.deps .ln{min-width:36px;padding:0 6px;border-radius:7px;border:1.5px solid var(--ink);font-weight:700;font-size:13.5px;text-align:center;line-height:1.5}
.deps .ln.train{background:var(--ink);color:var(--bg)}
.deps .ln.sev{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.deps .ds{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deps .late{color:var(--danger);font-weight:600;font-size:13px;margin-left:4px}
.deps li.gone .ds,.deps li.gone .m{text-decoration:line-through;color:var(--muted)}
.live{flex:none;display:inline-flex;align-items:center;gap:6px;color:var(--on);font-weight:600;font-size:13px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}

/* flyers */
.closed{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:14.5px}
.closed li{display:flex;gap:8px;align-items:baseline}
.closed li::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--danger)}
.closed li.short::before{background:var(--accent)}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:inherit;transform-origin:left;transition:transform .6s var(--ease-out, ease)}

/* quick actions and instructions: small tiles, two per row */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:104px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);
  color:inherit;text-decoration:none;cursor:pointer;font:inherit;text-align:left;animation:in .5s var(--ease-out, cubic-bezier(.22,1,.36,1)) backwards;animation-delay:calc(var(--i, 0) * 45ms);
  transition:transform .18s var(--ease-out, ease)}
.tile:active{transform:scale(.97)}
.tile .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line)}
.tile .ic svg{width:20px;height:20px}
.tile.dt .ic{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-family:var(--f-display);font-weight:700;font-size:17px}
.tile b{display:block;font-weight:600;font-size:16px;line-height:1.25}
.tile small{display:block;color:var(--muted);font-size:13.5px;line-height:1.3;margin-top:2px}
.group{margin:10px 2px -2px;font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tile.quiet{min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;padding:12px}
.tile.quiet .ic{flex:none;width:34px;height:34px}
.foot{margin-top:20px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:480px){h1{font-size:36px}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="toprow"><button class="menubtn" id="menubtn" type="button" aria-expanded="false" aria-controls="drawer" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Розділи</span></button><button class="themebtn" id="themebtn" type="button" aria-label="Увімкнути темну тему"><svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M5.3 18.7L7 17M17 7l1.7-1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6z" fill="currentColor"/></svg></button></div>
    <div class="eyebrow" id="today">Xanten</div>

  </header>
  <main>
    <a class="card" id="c-wx" href="pogoda/" style="--i:0">
      <div class="ch"><span class="ic" data-icon="sun"></span><span class="lab" id="wx-lab">Погода</span><span data-icon="next"></span></div>

      <div id="list-body"><span class="skel w60"></span></div>

      <a class="tile dt" id="t-dticket" href="https://play.google.com/store/apps/details?id=mentz.com.vrr_cibo_app" target="_blank" rel="noopener" style="--i:5">
        <span class="ic" aria-hidden="true">D</span><span><b>Мій D-Ticket</b><small id="dt-sub">Відкрити VRR App</small></span></a>
      <a class="tile" href="scan/" style="--i:6"><span class="ic" data-icon="scan"></span><span><b>Сканер</b><small>Фото документа в PDF і переклад</small></span></a>
    </div>

      <a class="tile quiet" href="sushka/" style="--i:8"><span class="ic" data-icon="dry"></span><span><b>Сушарка</b><small>Gorenje</small></span></a>

  <p class="foot">D-SIM’YA — помічник для життя в Німеччині. Свайп від лівого краю відкриває розділи.</p>
</div>
<script src="assets/ui.js?v=14"></script>
<script type="module">
import { WORKER_URL, PLACES, homePlace, getWeather, getWarnings, warnWhen, wxIcon, wxText, advice, deg } from './pogoda/wx.js';
import { BINS, binsOn, berlinDay, prefsOf } from './smittia/due.js';
import { flyerWeek, closures, rangeText, dayText, addDays } from './prospekty/week.js';

const $ = (s, r) => (r || document).querySelector(s);
const tgApp = window.Telegram && window.Telegram.WebApp;
const tg = tgApp && tgApp.platform && tgApp.platform !== 'unknown' ? tgApp : null;
if (tg) { try { tg.ready(); tg.expand(); if (tg.BackButton) tg.BackButton.hide(); } catch (e) {} }
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'})[c]);
const load = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const svg = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',
  trash: '<path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10.5 11v5.5M13.5 11v5.5"/>',
  bus: '<rect x="5" y="3.5" width="14" height="14" rx="3"/><path d="M5 11h14M8.5 20.5v-3M15.5 20.5v-3M8.5 14.3h.01M15.5 14.3h.01M9 6.5h6"/>',
  tag: '<path d="M3.5 12.3V5A1.5 1.5 0 0 1 5 3.5h7.3l8.2 8.2a1.5 1.5 0 0 1 0 2.1l-6.7 6.7a1.5 1.5 0 0 1-2.1 0z"/><circle cx="8" cy="8" r="1.4"/>',
  scan: '<path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M7.5 12h9"/>',
  wash: '<rect x="4" y="3" width="16" height="18" rx="2.5"/><circle cx="12" cy="13" r="4.5"/><path d="M7.5 6.5h2"/>',
  dry: '<rect x="4" y="3" width="16" height="18" rx="2.5"/><circle cx="12" cy="13" r="4.5"/><path d="M10.2 11.8c.6.6 1.2.6 1.8 0s1.2-.6 1.8 0M10.2 14.6c.6.6 1.2.6 1.8 0s1.2-.6 1.8 0"/>',
  next: '<path d="M9 6l6 6-6 6"/>',
  cart: '<path d="M3 4h2.2l2.2 10.2a1.5 1.5 0 0 0 1.5 1.2h8.3a1.5 1.5 0 0 0 1.5-1.1L20.5 8H6.2"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/>',
};
document.querySelectorAll('[data-icon]').forEach((el) => {
  const k = el.dataset.icon;
  el.outerHTML = k === 'next' ? svg(ICON.next).replace('<svg', '<svg class="go"') : `<span class="${el.className}" aria-hidden="true">${svg(ICON[k])}</span>`;
});
const TIP = { rain: '<path d="M3 12a9 9 0 0 1 18 0z"/><path d="M12 12v6.5a2 2 0 0 1-4 0"/>', snow: '<path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/>',
  storm: '<path d="M13 3L5 13h6l-1 8 8-10h-6z"/>', ice: '<path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/>', wind: '<path d="M3 9h11a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3M3 12h7"/>',
  dry: '<path d="M5 12.5l4.5 4.5L19 7.5"/>' };

/* ---------- greeting and date (Xanten time) ---------- */
const now = new Date();
const hour = Number(new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Berlin', hour: 'numeric', hourCycle: 'h23' }).format(now));
$('#hello').textContent = hour >= 5 && hour < 11 ? 'Доброго ранку' : hour >= 11 && hour < 17 ? 'Добрий день' : hour >= 17 && hour < 22 ? 'Добрий вечір' : 'Доброї ночі';
const todayText = new Intl.DateTimeFormat('uk-UA', { timeZone: 'Europe/Berlin', weekday: 'long', day: 'numeric', month: 'long' }).format(now);
$('#today').textContent = todayText + ' · Xanten';

/* ---------- weather ---------- */
const place = homePlace() || 'Xanten';
$('#wx-lab').textContent = 'Погода · ' + place;
getWeather(...PLACES[place]).then((d) => {
  const tips = advice(d), first = tips.find((a) => a.kind !== 'dry') || tips[0];
  const t = d.daily;
  $('#wx-body').innerHTML = `<div class="wx">${wxIcon(d.now.weather_code, d.now.is_day)}<div><div class="t">${deg(d.now.temperature_2m)}</div>` +
    `<div class="d">${esc(wxText(d.now.weather_code))} · ${deg(t.temperature_2m_min[0])} … ${deg(t.temperature_2m_max[0])}</div></div></div>` +
    `<p class="tip ${first.kind === 'dry' ? 'dry' : ''}">${svg(TIP[first.kind] || TIP.dry)}<span>${esc(first.text)}</span></p>`;
  $('#c-wx').setAttribute('aria-label', `Погода, ${place}: ${deg(d.now.temperature_2m)}, ${wxText(d.now.weather_code)}. ${first.text}`);
  // the strongest official warning, if there is one
  getWarnings(...PLACES[place]).then((w) => {
    const top = (w.warnings || [])[0]; if (!top) return;
    const more = w.warnings.length - 1;
    $('#wx-body').insertAdjacentHTML('beforeend', `<p class="dwd lv${top.level}"><span><b>DWD: ${esc(top.uk)}</b> · рівень ${top.level} з 4` +
      `<small>${esc(warnWhen(top))}${more > 0 ? ` · ще ${more} ${more === 1 ? 'попередження' : 'попередження'}` : ''}</small></span></p>`);
    $('#c-wx').setAttribute('aria-label', $('#c-wx').getAttribute('aria-label') + ` Попередження DWD: ${top.uk}, рівень ${top.level} з 4.`);
  }).catch(() => {});
}).catch(() => { $('#wx-body').innerHTML = '<div class="big">Погода</div><p class="sub">Не вдалося завантажити. Натисни, щоб відкрити розділ.</p>'; });

/* ---------- waste: the next pickup for the household ---------- */
const short = (day) => new Date(day + 'T12:00:00Z').toLocaleDateString('uk-UA', { day: 'numeric', month: 'long', timeZone: 'UTC' });
const weekday = (day) => new Date(day + 'T12:00:00Z').toLocaleDateString('uk-UA', { weekday: 'long', timeZone: 'UTC' }).replace("'", 'ʼ');
const ACC = { 'середа': 'середу', 'пʼятниця': 'пʼятницю', 'субота': 'суботу', 'неділя': 'неділю' };
function cloudGet(key) {
  const c = tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') ? tg.CloudStorage : null;
  return new Promise((res) => { if (!c) return res(null); try { c.getItem(key, (err, v) => { try { res(err || !v ? null : JSON.parse(v)); } catch (e) { res(null); } }); } catch (e) { res(null); } });
}
fetch('smittia/kalender.json').then((r) => r.json()).then(async (cal) => {
  let prefs = load('smittia-prefs') || await cloudGet('smittia');
  if (prefs && !cal.dates[prefs.district]) prefs = null;
  if (!prefs) {
    $('#waste-body').innerHTML = '<div class="big">Вибери свій район</div><p class="sub">Тоді тут буде найближчий вивіз баків.</p>';
    return;
  }
  const p = prefsOf(cal, prefs), today = berlinDay(new Date()), tomorrow = berlinDay(new Date(), 1);
  let next = null;
  for (let i = 0; i < 70 && berlinDay(new Date(), i) <= cal.until; i++) {
    const day = berlinDay(new Date(), i), bins = binsOn(cal, day, p);
    if (bins.length) { next = { day, bins }; break; }
  }
  if (!next) { $('#waste-body').innerHTML = '<div class="big">Дат поки немає</div><p class="sub">Календар на наступний рік ще не вийшов.</p>'; return; }
  const when = next.day === today ? 'Сьогодні' : next.day === tomorrow ? 'Завтра' : `У ${ACC[weekday(next.day)] || weekday(next.day)}`;
  const lead = next.day === tomorrow ? 'Сьогодні ввечері виставити баки' : next.day === today ? 'Баки вже мають стояти біля дороги' : short(next.day);
  $('#c-waste').classList.toggle('soon', next.day === today || next.day === tomorrow);
  $('#waste-body').innerHTML = `<div class="big">${esc(when)}${next.day === today || next.day === tomorrow ? ', ' + esc(short(next.day)) : ''}</div><p class="sub">${esc(lead)}</p>` +
    `<ul class="bins">${next.bins.map(({ bin, only14 }) => `<li><span class="dot" style="background:${BINS[bin].color}"></span>${esc(BINS[bin].uk.replace(' бак', ''))}${only14 ? ' (2 тижні)' : ''}</li>`).join('')}</ul>`;
}).catch(() => { $('#waste-body').innerHTML = '<div class="big">Сміття</div><p class="sub">Не вдалося завантажити дати.</p>'; });

/* ---------- departures from my stop ---------- */
const DEFAULT_STOP = { id: 'de:05170:37032', name: 'Xanten, Bahnhof' };
const shortStop = (name) => { const m = String(name).match(/^([^,]+),\s*(.+)$/); return m ? (m[2].startsWith(m[1]) ? m[2] : m[1] + ' ' + m[2]) : String(name); };
const hm = (iso) => new Intl.DateTimeFormat('de-DE', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit' }).format(new Date(iso));
async function stopNow() {
  const s = load('transport-stops') || await cloudGet('transport');
  return (s && Array.isArray(s.list) && (s.list.find((x) => x.id === s.active) || s.list[0])) || DEFAULT_STOP;
}
let depData = null;
function renderDeps() {
  if (!depData) return;
  const t = Date.now(), when = (d) => new Date(d.gone ? d.plan : d.est || d.plan).getTime();
  const list = depData.deps.filter((d) => when(d) > t - 30000).sort((a, b) => when(a) - when(b)).slice(0, 3);
  $('#dep-body').innerHTML = list.length ? `<ul class="deps">${list.map((d) => {
    const mins = Math.round((when(d) - t) / 60000), late = d.est && !d.gone ? Math.round((new Date(d.est) - new Date(d.plan)) / 60000) : 0;
    const sev = /^SEV\b/.test(d.line), cls = sev ? 'sev' : d.mode === 'train' ? 'train' : '';
    return `<li class="${d.gone ? 'gone' : ''}"><span class="m ${!d.gone && mins <= 2 ? 'now' : ''}">${d.gone ? hm(d.plan) : mins <= 0 ? 'зараз' : mins < 60 ? mins + ' хв' : hm(when(d))}</span>` +
      `<span class="ln ${cls}">${esc(d.line.replace(/^SEV\s*RB\s*/, 'SEV '))}</span><span class="ds" lang="de">${esc(d.dest)}${late >= 1 ? `<span class="late">+${late}</span>` : ''}</span></li>`;
  }).join('')}</ul>` : '<p class="sub">Найближчим часом відправлень немає.</p>';
}
async function loadDeps() {
  const stop = await stopNow();
  $('#dep-lab').textContent = 'Транспорт · ' + shortStop(stop.name);
  try {
    const r = await fetch(WORKER_URL.replace(/\/*$/, '/') + 'transit/departures?stop=' + encodeURIComponent(stop.id));
    const d = await r.json(); if (!d.ok) throw new Error(d.error);
    depData = d;
    $('#dep-live').hidden = !d.deps.some((x) => x.live);
    renderDeps();
  } catch (e) {
    if (!depData) $('#dep-body').innerHTML = '<p class="sub">Не вдалося завантажити відправлення. Натисни, щоб відкрити розділ.</p>';
  }
}
loadDeps();
setInterval(() => { if (document.visibilityState === 'visible') renderDeps(); }, 15000);
setInterval(() => { if (document.visibilityState === 'visible') loadDeps(); }, 30000);

/* ---------- flyers this week ---------- */
const today = berlinDay(new Date()), week = flyerWeek(today);
const seen = load('prospekty-seen');
const nSeen = seen && seen.week === week.monday && Array.isArray(seen.urls) ? seen.urls.length : 0;
$('#fly-lab').textContent = `Проспекти · KW ${week.kw}`;
const ahead = closures(today > week.monday ? today : week.monday, week.saturday);
$('#fly-body').innerHTML = `<div class="big">${week.sunday ? 'Нові проспекти вже вийшли' : `Акції до суботи, ${esc(dayText(week.saturday, { day: 'numeric', month: 'long' }))}`}</div>` +
  `<p class="sub">${nSeen ? `Переглянуто ${nSeen} ${nSeen === 1 ? 'проспект' : nSeen < 5 ? 'проспекти' : 'проспектів'} цього тижня.` : week.sunday ? 'На наступний тиждень, ' + esc(rangeText(week.monday, week.saturday)) + '.' : 'Цього тижня ще нічого не переглянуто.'}</p>` +
  (ahead.length ? `<ul class="closed">${ahead.map((c) => `<li class="${c.kind}">${esc(dayText(c.day))}: ${esc(c.uk)}, ${c.kind === 'closed' ? 'магазини зачинені' : 'до 14:00'}</li>`).join('')}</ul>` : '');

/* ---------- the family shopping list ---------- */
function renderList(d) {
  if (!d || !Array.isArray(d.items)) return;
  const open = d.items.filter((x) => !x.d), names = open.slice(0, 3).map((x) => x.t);
  const shops = [...new Set(open.map((x) => x.s).filter(Boolean))];
  const word = (n) => (n % 10 === 1 && n % 100 !== 11 ? 'річ' : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? 'речі' : 'речей');
  $('#list-body').innerHTML = open.length
    ? `<div class="big">${open.length} ${word(open.length)} купити</div><p class="sub">${esc(names.join(', '))}${open.length > 3 ? ' …' : ''}${shops.length ? ` · ${esc(shops.join(', '))}` : ''}</p>`
    : `<div class="big">Список порожній</div><p class="sub">${(d.members || []).length > 1 ? 'Спільний: ' + esc(d.members.join(', ')) + '.' : 'Додай, що купити, і запроси родину.'}</p>`;
}
if (tg && tg.initData) {
  renderList(load('spysok-cache'));
  const fd = new FormData(); fd.append('initData', tg.initData); fd.append('action', 'get');
  fetch(WORKER_URL.replace(/\/*$/, '/') + 'list', { method: 'POST', body: fd }).then((r) => r.json()).then((d) => {
    if (!d.ok) throw new Error(d.error);
    const keep = { items: d.items, members: d.members, v: d.v };
    try { localStorage.setItem('spysok-cache', JSON.stringify(keep)); } catch (e) {}
    renderList(keep);
  }).catch(() => { if (!load('spysok-cache')) $('#list-body').innerHTML = '<p class="sub">Не вдалося завантажити список. Натисни, щоб відкрити.</p>'; });
} else {
  $('#list-body').innerHTML = '<div class="big">Спільний для родини</div><p class="sub">Працює, коли D-SIM’YA відкрито через бота в Telegram.</p>';
}

/* ---------- D-Ticket: the VRR App through its store page ---------- */
const PLAY = 'https://play.google.com/store/apps/details?id=mentz.com.vrr_cibo_app', APPLE = 'https://apps.apple.com/de/app/vrr-app-bus-bahn-bike-p-r/id1491339288';
const ios = tg ? tg.platform === 'ios' : /iPhone|iPad|iPod/.test(navigator.userAgent);
$('#t-dticket').href = ios ? APPLE : PLAY;
$('#dt-sub').textContent = 'Відкрити VRR App';
document.addEventListener('click', (e) => {
  const a = e.target.closest('a[target="_blank"]');
  if (a && tg && tg.openLink) { e.preventDefault(); try { tg.openLink(a.href); } catch (err) { location.href = a.href; } }
});
</script>
